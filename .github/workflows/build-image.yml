name: Build and publish poetry API image

on:
  push:
    branches: [main]
    paths:
      - poetry-llm/Dockerfile
      - poetry-llm/requirements-serving.txt
      - poetry-llm/poetry_llm/**
      - poetry-llm/serving/**
      - poetry-llm/exports/poetry-10m/**
      - poetry-llm/scripts/update_image_digest.py
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: poetry-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./poetry-llm
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/poetry-llm:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/poetry-llm:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Pin Kubernetes Deployment to image digest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/poetry-llm
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python poetry-llm/scripts/update_image_digest.py \
            --deployment poetry-llm/k8s/deployment.yaml \
            --image "$IMAGE_NAME" \
            --digest "$IMAGE_DIGEST"

      - name: Commit immutable deployment reference
        run: |
          if git diff --quiet -- poetry-llm/k8s/deployment.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add poetry-llm/k8s/deployment.yaml
          git commit -m "deploy: pin poetry image for ${GITHUB_SHA::7}"
          git push
