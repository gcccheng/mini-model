apiVersion: apps/v1
kind: Deployment
metadata:
  name: poetry-api
  namespace: poetry-llm
  labels:
    app.kubernetes.io/name: poetry-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: poetry-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poetry-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: poetry-api
          image: ghcr.io/gcccheng/poetry-llm@sha256:d3584741c59533f52f089b3d3203a91c962e781c460cc2e7c371cbf87915b0df
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MODEL_DEVICE
              value: cpu
            - name: TORCH_NUM_THREADS
              value: "2"
            # Only a one-way verifier is stored in Git; the API key stays local.
            - name: POETRY_API_KEY_SHA256
              value: a417b0b0558cf9561d00e85cb3ae49852e8da477127c8c9d634a9fe3bff16493
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1200Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
