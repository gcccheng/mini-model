apiVersion: v1
kind: Service
metadata:
  name: poetry-api
  namespace: poetry-llm
  labels:
    app.kubernetes.io/name: poetry-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: poetry-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
